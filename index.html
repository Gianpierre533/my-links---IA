  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gianpierre Vasquez — MyLinks</title>

      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #09090d;
        --card-bg: #13131c;
        --card-border: rgba(255, 255, 255, 0.07);
        --text-hi: #eeeef5;
        --text-mid: #7f7f9a;
        --text-lo: #4a4a62;

        /* ── Button palette (adapted from existing) ── */
        --btn-li-from: #44d4f4;
        --btn-li-to: #4a56f0;
        --btn-li-glow: rgba(74, 86, 240, 0.45);
        --btn-li-glow2: rgba(68, 212, 244, 0.25);

        --btn-dc: #6c5ce7;
        --btn-dc-glow: rgba(108, 92, 231, 0.48);

        --btn-yt: #e5334a;
        --btn-yt-glow: rgba(229, 51, 74, 0.45);

        --btn-tw-bg: #1e1e2c;
        --btn-tw-bd: rgba(255, 255, 255, 0.13);
        --btn-tw-glow: rgba(0, 0, 0, 0.55);
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Outfit", sans-serif;
        background: var(--bg);
        color: var(--text-hi);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        position: relative;
        overflow: hidden;
      }

      /* ── Diagonal line decorations ─────────────────────── */
      .deco {
        position: fixed;
        pointer-events: none;
      }
      .deco-tl {
        top: 4%;
        left: 2%;
      }
      .deco-tr {
        top: 3%;
        right: 2%;
      }
      .deco-ml {
        top: 50%;
        left: 1%;
        transform: translateY(-50%);
      }
      .deco-bl {
        bottom: 4%;
        left: 2%;
      }
      .deco-br {
        bottom: 3%;
        right: 2%;
      }

      /* ── Card ──────────────────────────────────────────── */
      .card {
        position: relative;
        z-index: 1;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        width: 100%;
        max-width: 900px;
        padding: 2.5rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 32px 80px rgba(0, 0, 0, 0.55),
          0 8px 24px rgba(0, 0, 0, 0.35);
      }

      @media (min-width: 640px) {
        .card {
          flex-direction: row;
          align-items: center;
          padding: 3rem 3.5rem;
          gap: 3.5rem;
        }
      }

      /* ── Profile ───────────────────────────────────────── */
      .profile {
        flex: 1;
        min-width: 0;
      }

      .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.18);
        overflow: hidden;
        margin-bottom: 1.6rem;
        background: #22223a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 500;
        color: var(--text-mid);
        letter-spacing: 0.02em;
        flex-shrink: 0;
        box-shadow:
          0 0 0 4px rgba(74, 86, 240, 0.12),
          0 0 0 8px rgba(74, 86, 240, 0.05);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .profile-tag {
        font-size: 0.62rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--text-lo);
        font-weight: 400;
        margin-bottom: 0.45rem;
      }

      .profile-name {
        font-size: clamp(1.9rem, 4.5vw, 2.8rem);
        font-weight: 300;
        letter-spacing: -0.025em;
        line-height: 1.1;
        color: var(--text-hi);
        margin-bottom: 1rem;
      }

      .profile-bio {
        font-size: 0.875rem;
        font-weight: 400;
        line-height: 1.7;
        color: var(--text-mid);
        max-width: 340px;
      }

      /* ── Links column ──────────────────────────────────── */
      .links {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 0;
      }

      /* ════════════════════════════════════════════════════
       BUTTON BASE — sombras + bordes + hover mejorados
    ════════════════════════════════════════════════════ */
      .link-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none;
        border-radius: 100px;
        padding: 0.78rem 0.78rem 0.78rem 1.5rem;
        font-family: "Outfit", sans-serif;
        font-size: 0.92rem;
        font-weight: 500;
        color: #fff;
        border: 1px solid transparent;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        will-change: transform, box-shadow;

        /* Transición rica: transform + shadow + border + brightness */
        transition:
          transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.22s ease,
          border-color 0.22s ease,
          filter 0.18s ease;
      }

      /* Shimmer pseudo-element — sweep on hover */
      .link-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          105deg,
          transparent 20%,
          rgba(255, 255, 255, 0.12) 50%,
          transparent 80%
        );
        transform: translateX(-110%);
        transition: transform 0.5s ease;
        pointer-events: none;
      }

      .link-btn:hover::before {
        transform: translateX(110%);
      }

      /* Highlight top-edge inner glow */
      .link-btn::after {
        content: "";
        position: absolute;
        top: 0;
        left: 12%;
        right: 12%;
        height: 1px;
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.28);
        pointer-events: none;
        transition: opacity 0.22s ease;
      }

      .link-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-3px) scale(1.015);
      }
      .link-btn:active {
        transform: translateY(0) scale(0.975);
        filter: brightness(0.95);
      }

      /* Icon bubble */
      .btn-label {
        flex: 1;
      }

      .btn-icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-left: 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition:
          background 0.2s ease,
          transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .link-btn:hover .btn-icon {
        background: rgba(0, 0, 0, 0.38);
        transform: scale(1.1) rotate(-6deg);
      }

      .btn-icon svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        display: block;
      }

      /* ── LinkedIn ── */
      .btn-linkedin {
        background: linear-gradient(
          90deg,
          var(--btn-li-from) 0%,
          var(--btn-li-to) 100%
        );
        border-color: rgba(68, 212, 244, 0.3);
        box-shadow:
          0 4px 18px var(--btn-li-glow),
          0 1px 6px var(--btn-li-glow2),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      .btn-linkedin:hover {
        box-shadow:
          0 8px 30px var(--btn-li-glow),
          0 2px 10px var(--btn-li-glow2),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        border-color: rgba(68, 212, 244, 0.55);
      }

      /* ── Discord ── */
      .btn-discord {
        background: var(--btn-dc);
        border-color: rgba(108, 92, 231, 0.4);
        box-shadow:
          0 4px 18px var(--btn-dc-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
      .btn-discord:hover {
        box-shadow:
          0 8px 30px var(--btn-dc-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        border-color: rgba(140, 124, 255, 0.6);
      }

      /* ── YouTube ── */
      .btn-youtube {
        background: var(--btn-yt);
        border-color: rgba(229, 51, 74, 0.4);
        box-shadow:
          0 4px 18px var(--btn-yt-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
      .btn-youtube:hover {
        box-shadow:
          0 8px 30px var(--btn-yt-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 80, 100, 0.6);
      }

      /* ── X / Twitter ── */
      .btn-twitter {
        background: var(--btn-tw-bg);
        border-color: var(--btn-tw-bd);
        color: var(--text-hi);
        box-shadow:
          0 4px 16px var(--btn-tw-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .btn-twitter:hover {
        box-shadow:
          0 8px 28px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 255, 255, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.28);
      }
      .btn-twitter .btn-icon {
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
